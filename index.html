<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMuiz - เครื่องมือหั่นข้อความ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f1f5f9; /* Slate 100 */
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <!-- Header ย่อขนาดลงครึ่งหนึ่งตามสั่ง -->
        <div class="bg-gradient-to-r from-violet-600 to-fuchsia-600 px-6 py-3 rounded-t-3xl text-white shadow-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-1">
            <h1 class="text-xl font-bold flex items-center gap-2 tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                TheMuiz
            </h1>
            <p class="opacity-90 text-xs text-fuchsia-100 font-light">หั่นข้อความเป็นท่อน/กำหนดตัวเลขจำนวนตัวอักษรได้</p>
        </div>

        <div class="bg-slate-800 p-6 rounded-b-3xl shadow-2xl border-x border-b border-slate-700">
            <!-- Settings: Max Length Input -->
            <div class="mb-6 bg-slate-900/60 p-3 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-3 max-w-lg mx-auto">
                <div>
                    <label for="maxLengthInput" class="block text-slate-200 font-semibold text-xs">จำนวนตัวอักษรสูงสุดต่อท่อน:</label>
                    <span class="text-[10px] text-slate-400">ตัดไม่ให้คำขาดอัตโนมัติ</span>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" id="maxLengthInput" value="" placeholder="กรอกตัวเลข" min="5" max="1000"
                        class="w-24 p-1.5 bg-slate-950 border border-slate-700 rounded-lg focus:border-fuchsia-500 focus:outline-none transition-all text-center text-fuchsia-400 font-bold text-sm shadow-inner">
                    <span class="text-slate-400 text-xs">ตัวอักษร</span>
                </div>
            </div>

            <!-- Input -->
            <div class="mb-6">
                <label class="block text-slate-300 font-semibold mb-2">วางข้อความของเตงที่นี่:</label>
                <textarea id="textInput" 
                    class="w-full h-40 p-4 bg-slate-900 border-2 border-slate-700 rounded-2xl focus:border-fuchsia-500 focus:outline-none transition-all text-slate-200 shadow-inner placeholder-slate-500"
                    placeholder="ใส่ข้อความของตะเองได้เลยนะ..."></textarea>
                
                <div class="mt-2 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <!-- ปุ่มล้างข้อความสีแดง -->
                        <button id="clearBtn" class="text-xs bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded-lg border border-red-800/50 transition-all active:scale-95">
                            ล้างข้อความ
                        </button>
                        <!-- ปุ่มคัดลอกข้อความสีเขียว อยู่ขวามือของปุ่มล้างข้อความ -->
                        <button id="copyInputBtn" class="text-xs bg-emerald-900/30 hover:bg-emerald-600 text-emerald-400 hover:text-white px-3 py-1.5 rounded-lg border border-emerald-800/50 transition-all active:scale-95 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            คัดลอกข้อความ
                        </button>
                    </div>
                    <!-- เพิ่มระยะห่าง (gap-5) เพื่อไม่ให้ติดกันเกินไป และจัดเรียงสวยงาม -->
                    <div class="text-[11px] flex gap-5 text-slate-400 pl-3">
                        <div>
                            <span>ตัวอักษร :</span> 
                            <span id="totalChars" class="font-bold text-fuchsia-400">0</span>
                        </div>
                        <div>
                            <span>ท่อน :</span> 
                            <span id="totalChunks" class="font-bold text-fuchsia-400">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chunks Display -->
            <div class="border-t border-slate-700 pt-6">
                <label class="block text-slate-200 font-semibold mb-4 text-lg border-l-4 border-fuchsia-500 pl-3">
                    รายการแบ่งท่อน
                </label>
                <div id="chunksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Chunks will be generated here -->
                </div>

                <!-- ปุ่ม Save ด้านล่างสุด -->
                <div id="saveContainer" class="mt-8 hidden flex justify-center">
                    <button id="saveTxtBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        บันทึกไฟล์ หั่นข้อความ.txt
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const maxLengthInput = document.getElementById('maxLengthInput');
        const totalCharsDisplay = document.getElementById('totalChars');
        const totalChunksDisplay = document.getElementById('totalChunks');
        const chunksContainer = document.getElementById('chunksContainer');
        const clearBtn = document.getElementById('clearBtn');
        const copyInputBtn = document.getElementById('copyInputBtn');
        const saveContainer = document.getElementById('saveContainer');
        const saveTxtBtn = document.getElementById('saveTxtBtn');

        let currentChunks = [];

        // ฟังก์ชันพระเอกของเราสำหรับหั่นข้อความไม่ให้ขาดคำ
        function smartSplit(text, limit) {
            let chunks = [];
            let remainingText = text.trim();

            let segmenter;
            try {
                segmenter = new Intl.Segmenter('th', { granularity: 'word' });
            } catch (e) {
                segmenter = null;
            }

            while (remainingText.length > 0) {
                if (remainingText.length <= limit) {
                    chunks.push(remainingText);
                    break;
                }

                let cutIndex = limit;

                if (segmenter) {
                    let lookAheadText = remainingText.substring(0, limit + 20);
                    const segments = segmenter.segment(lookAheadText);
                    
                    let currentLen = 0;
                    
                    for (const segment of segments) {
                        if (currentLen + segment.segment.length > limit) {
                            break;
                        }
                        currentLen += segment.segment.length;
                    }

                    if (currentLen > 0) {
                        cutIndex = currentLen;
                    }
                } else {
                    let potentialChunk = remainingText.substring(0, limit);
                    let lastSpace = potentialChunk.lastIndexOf(' ');
                    if (lastSpace >= limit - 10 && lastSpace > 0) {
                        cutIndex = lastSpace;
                    }
                }

                let finalChunk = remainingText.substring(0, cutIndex).trim();
                if (finalChunk.length > 0) {
                    chunks.push(finalChunk);
                }

                remainingText = remainingText.substring(cutIndex).trim();
            }
            return chunks;
        }

        function processText() {
            const text = textInput.value;
            let limit = parseInt(maxLengthInput.value);
            
            totalCharsDisplay.textContent = text.length;

            if (text.trim().length === 0 || isNaN(limit) || limit < 5) {
                chunksContainer.innerHTML = '';
                totalChunksDisplay.textContent = '0';
                saveContainer.classList.add('hidden');
                currentChunks = [];
                return;
            }

            currentChunks = smartSplit(text, limit);
            totalChunksDisplay.textContent = currentChunks.length;
            saveContainer.classList.remove('hidden');

            chunksContainer.innerHTML = '';
            currentChunks.forEach((chunkText, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-700 rounded-xl p-4 flex flex-col justify-between hover:border-fuchsia-500 transition-colors shadow-lg';

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="bg-fuchsia-900/40 text-fuchsia-300 text-xs font-bold px-2 py-1 rounded">ท่อนที่ ${index + 1}</span>
                        <span class="text-xs text-slate-400">${chunkText.length} / ${limit} ตัวอักษร</span>
                    </div>
                    <div class="text-sm text-slate-200 bg-slate-950/50 p-3 rounded-lg mb-3 min-h-[4rem] break-words">
                        ${escapeHtml(chunkText)}
                    </div>
                    <button onclick="copyToClipboard(this, \`${encodeURIComponent(chunkText)}\`)" 
                        class="w-full py-2 bg-slate-700 hover:bg-fuchsia-600 text-white rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        คัดลอกท่อนนี้
                    </button>
                `;
                chunksContainer.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        // ฟังก์ชันล้างข้อความ
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            processText();
            textInput.focus();
        });

        // ฟังก์ชันคัดลอกข้อความทั้งหมดในช่องพิมพ์
        copyInputBtn.addEventListener('click', () => {
            if (!textInput.value) return;
            textInput.select();
            try {
                document.execCommand('copy');
                const originalText = copyInputBtn.innerHTML;
                copyInputBtn.innerHTML = 'คัดลอกแล้ว!';
                copyInputBtn.classList.replace('text-emerald-400', 'text-white');
                copyInputBtn.classList.replace('bg-emerald-900/30', 'bg-emerald-600');
                setTimeout(() => {
                    copyInputBtn.innerHTML = originalText;
                    copyInputBtn.classList.replace('text-white', 'text-emerald-400');
                    copyInputBtn.classList.replace('bg-emerald-600', 'bg-emerald-900/30');
                }, 1000);
            } catch (err) {
                console.error('Copy failed', err);
            }
        });

        // ฟังก์ชัน Save ไฟล์ txt
        saveTxtBtn.addEventListener('click', () => {
            if (currentChunks.length === 0) return;

            const fileContent = currentChunks.map((chunk, i) => `[ท่อนที่ ${i + 1}]\n${chunk}`).join('\n\n');
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'หั่นข้อความ.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        function copyToClipboard(btn, encodedText) {
            const text = decodeURIComponent(encodedText);
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const originalContent = btn.innerHTML;
                btn.innerHTML = 'สำเร็จแล้วจ้า!';
                btn.classList.replace('bg-slate-700', 'bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-600', 'bg-slate-700');
                }, 1000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textarea);
        }

        textInput.addEventListener('input', processText);
        maxLengthInput.addEventListener('input', processText);
    </script>
</body>
</html>
